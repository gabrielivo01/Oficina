version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: oficina_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_SECURITY_ENABLED: "true"
      JWT_SECRET: sua-chave-secreta-deve-ter-pelo-menos-256-bits-aqui
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/oficina_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH: "false"
      SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE: "false"
      APP_MAIL_ENABLED: "false"
      APP_MAIL_FROM: no-reply@oficina.local
      APP_MAIL_TO: cliente@oficina.local
      APP_INTERNAL_API_KEY: chave-interna-docker-apenas-para-dev
    ports:
      - "8080:8080"

  postgres:
    image: postgres:16
    container_name: postgres_oficina
    restart: always
    environment:
      POSTGRES_DB: oficina_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oficina_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: mailhog_oficina
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  # Prometheus + Grafana below are a local stand-in for the real
  # kube-prometheus-stack deployment in oficina-infra-k8s (k8s/observability/).
  # For a one-off local demo only — not used in the real k8s deployment.
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus_oficina
    restart: unless-stopped
    depends_on:
      - app
    volumes:
      - ./observability/local/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana_oficina
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/local/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/local/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

volumes:
  postgres_data: