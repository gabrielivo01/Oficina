name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci-quality:
    name: CI quality and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unitários, contrato, Saga em memória e BDD (sem Docker). Os *IT ficam no job "integracao" (ADR 0013).
      - name: Build, tests and quality checks
        run: ./mvnw -q clean verify

      - name: SonarCloud analysis and quality gate
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5.3.2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-saga-report
          path: target/cucumber-reports/
          if-no-files-found: warn

      - name: Build Docker image
        run: docker build -t oficina:ci-${{ github.sha }} .

  integracao:
    name: Integration tests (Testcontainers)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # O runner do GitHub tem Docker: PostgreSQL e RabbitMQ reais via Testcontainers.
      - name: Integration tests
        run: ./mvnw -q verify -Pintegracao

      - name: Upload failsafe reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failsafe-reports
          path: target/failsafe-reports/
          if-no-files-found: ignore
