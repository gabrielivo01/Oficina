name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  ci-quality:
    name: CI quality and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Unitários/mockados apenas; testes de integração não iniciam containers automaticamente.
      - name: Build, tests and quality checks
        run: ./mvnw -q clean -Dtest='*Test,!*IntegracaoTest,!MigracoesPostgresTest,!TopologiaRabbitMqSincronizadaTest' verify

      - name: SonarCloud analysis and quality gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true

      - name: Upload Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-saga-report
          path: target/cucumber-reports/
          if-no-files-found: warn

      - name: Build Docker image
        run: docker build -t oficina:ci-${{ github.sha }} .
