# Configuração do ArchUnit (usada por architecture/ArquiteturaTest)

# Violações já existentes ficam versionadas aqui e são toleradas; violações novas quebram o build.
freeze.store.default.path=src/test/resources/archunit_store

# false: uma regra nova sem store falha, em vez de congelar silenciosamente tudo o que viola.
# Para registrar uma regra NOVA (decisão consciente), rode uma única vez:
#   ./mvnw test -Dtest=ArquiteturaTest -Darchunit.freeze.store.default.allowStoreCreation=true
freeze.store.default.allowStoreCreation=false

# Nunca re-congelar automaticamente: violações novas devem ser corrigidas, não absorvidas.
freeze.refreeze=false
