# Broker dos testes de integração (Testcontainers). Importa no boot a MESMA topologia da plataforma:
# definitions.json ao lado é cópia de oficina-infra-k8s/local/rabbitmq/definitions.json (fonte única);
# TopologiaRabbitMqSincronizadaTest acusa divergência quando o repo irmão está presente.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json
loopback_users = none
