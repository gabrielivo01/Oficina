spring.application.name=oficina
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Segurança e autenticação: ligada por padrão. Só o perfil "local" desliga, no documento após o separador "#---"
# no fim deste arquivo (ali porque o hook pre-commit bloqueia application-local.properties). Uso:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
app.security.enabled=${APP_SECURITY_ENABLED:true}
jwt.expiration=${JWT_EXPIRATION:1800000}
jwt.secret=${JWT_SECRET:sua-chave-secreta-deve-ter-pelo-menos-256-bits-aqui}

# Chave usada por chamadas servico-a-servico (ex.: lambda de autenticacao por CPF) aos endpoints /internal/**
app.internal.api-key=${APP_INTERNAL_API_KEY:chave-interna-local-apenas-para-dev}

# Banco local padrão para execução simples e testes manuais
# (driver e dialeto são detectados pela URL; SPRING_DATASOURCE_DRIVER_CLASS_NAME/SPRING_JPA_DATABASE_PLATFORM ainda sobrescrevem)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:oficina;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# Schema versionado pelo Flyway (src/main/resources/db/migration); o Hibernate só valida o mapeamento.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
# Bancos que já existiam antes do Flyway (criados por ddl-auto=update) recebem baseline na V1 sem reexecutá-la
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

spring.mail.host=${SPRING_MAIL_HOST:localhost}
spring.mail.port=${SPRING_MAIL_PORT:1025}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
app.mail.enabled=${APP_MAIL_ENABLED:false}
app.mail.from=${APP_MAIL_FROM:no-reply@oficina.local}
app.mail.to=${APP_MAIL_TO:cliente@oficina.local}

# Mensageria (RabbitMQ). Padrão = plataforma local (oficina-infra-k8s/local/docker-compose.yml, usuário de dev).
# A topologia vem de oficina-infra-k8s/local/rabbitmq/definitions.json; o serviço não declara filas.
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:oficina}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:oficina}
# Publisher confirms + returns: o outbox só marca como enviada a mensagem confirmada e roteada
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
# Consumidor: 3 tentativas no total (1 + 2 retries) com backoff; depois rejeita sem requeue -> DLX -> *.dlq
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.retry.max-interval=10s
app.mensageria.exchange-eventos=oficina.eventos
app.mensageria.exchange-comandos=oficina.comandos
app.mensageria.fila-eventos=os.saga.eventos
app.mensageria.outbox.publicador-habilitado=${APP_MENSAGERIA_OUTBOX_PUBLICADOR_HABILITADO:true}
app.mensageria.outbox.intervalo=1s
app.mensageria.outbox.lote=50
app.mensageria.outbox.timeout-confirmacao=5s
#---
spring.config.activate.on-profile=local
app.security.enabled=false
